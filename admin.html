<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabase = supabase.createClient(https://rpbdygyzcdjsxnmvdtne.supabase.co, sb_publishable_f_MZ8P5eZtSC29hMWmuxXA_-alYehi5);

async function loadOrders() {
let { data } = await supabase.from("orders").select("*");

const table = document.getElementById("orders");

table.innerHTML = data.map(order => `
<tr>
<td>${order.product}</td>
<td>$${order.amount}</td>
<td>${order.status}</td>
<td>
<button onclick="complete('${order.id}')">Complete</button>
</td>
</tr>
`).join("");
}

async function complete(id){
await supabase.from("orders")
.update({status:"completed"})
.eq("id", id);

loadOrders();
}

loadOrders();
</script>

<table id="orders"></table>
